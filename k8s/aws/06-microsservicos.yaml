apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
      - name: evaluation-service
        image: 608541039538.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: togglemaster-config
        env:
        - name: PORT
          value: '8004'
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-secrets
              key: SERVICE_API_KEY
        - name: AWS_EC2_METADATA_DISABLED
          value: 'true'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 15
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8004
          periodSeconds: 5
          failureThreshold: 24
      serviceAccountName: evaluation-service
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: evaluation-service
  ports:
  - port: 8004
    targetPort: 8004
