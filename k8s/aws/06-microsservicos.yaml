apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 608541039538.dkr.ecr.us-east-1.amazonaws.com/auth-service:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: togglemaster-config
        env:
        - name: PORT
          value: '8001'
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-secrets
              key: MASTER_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: togglemaster-secrets
              key: AUTH_DATABASE_URL
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 5
          failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: togglemaster
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 8001
    targetPort: 8001
---
