# Antes de aplicar: construa e importe as cinco imagens nos dois workers.
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, namespace: togglemaster}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
        - name: auth-service
          image: localhost/togglemaster-auth:local
          imagePullPolicy: Never
          ports: [{containerPort: 8001}]
          envFrom: [{configMapRef: {name: togglemaster-config}}]
          env:
            - {name: PORT, value: "8001"}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: togglemaster-secrets, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: "postgres://tc:$(POSTGRES_PASSWORD)@postgres-auth:5432/auth_db?sslmode=disable"}
            - name: MASTER_KEY
              valueFrom: {secretKeyRef: {name: togglemaster-secrets, key: MASTER_KEY}}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /health, port: 8001}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 15, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: togglemaster}
spec:
  type: ClusterIP
  selector: {app: auth-service}
  ports: [{port: 8001, targetPort: 8001}]
---
