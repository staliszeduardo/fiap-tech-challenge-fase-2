apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: togglemaster}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: togglemaster}
spec:
  type: ClusterIP
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dynamodb-local, namespace: togglemaster}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: dynamodb-local}}
  template:
    metadata: {labels: {app: dynamodb-local}}
    spec:
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:latest
          command: [java, -jar, DynamoDBLocal.jar, -sharedDb, -dbPath, /data]
          workingDir: /home/dynamodblocal
          securityContext: {runAsUser: 0}
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8000}, initialDelaySeconds: 20, periodSeconds: 15}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: dynamodb-local, namespace: togglemaster}
spec:
  type: ClusterIP
  selector: {app: dynamodb-local}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sqs, namespace: togglemaster}
spec:
  replicas: 1
  selector: {matchLabels: {app: sqs}}
  template:
    metadata: {labels: {app: sqs}}
    spec:
      containers:
        - name: sqs
          image: softwaremill/elasticmq-native:latest
          ports: [{containerPort: 9324}]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe: {tcpSocket: {port: 9324}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 9324}, periodSeconds: 15}
          volumeMounts: [{name: config, mountPath: /opt/elasticmq.conf, subPath: elasticmq.conf}]
      volumes: [{name: config, configMap: {name: elasticmq-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: sqs, namespace: togglemaster}
spec:
  type: ClusterIP
  selector: {app: sqs}
  ports: [{port: 9324, targetPort: 9324}]
