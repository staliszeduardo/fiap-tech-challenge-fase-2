apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-auth-init
  namespace: togglemaster
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(64) NOT NULL UNIQUE,
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
  02-service-key.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 -v api_key_hash="$SERVICE_API_KEY_SHA256" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    INSERT INTO api_keys (name, key_hash)
    VALUES ('evaluation-service-local', :'api_key_hash')
    ON CONFLICT (key_hash) DO NOTHING;
    SQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-flag-init
  namespace: togglemaster
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) UNIQUE NOT NULL,
        description TEXT,
        is_enabled BOOLEAN NOT NULL DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    DROP TRIGGER IF EXISTS set_timestamp ON flags;
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-targeting-init
  namespace: togglemaster
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS targeting_rules (
        id SERIAL PRIMARY KEY,
        flag_name VARCHAR(100) UNIQUE NOT NULL,
        is_enabled BOOLEAN NOT NULL DEFAULT true,
        rules JSONB NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON targeting_rules
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticmq-config
  namespace: togglemaster
data:
  elasticmq.conf: |
    include classpath("application.conf")
    node-address {
      protocol = http
      host = sqs
      port = 9324
      context-path = ""
    }
    aws {
      region = us-east-1
      accountId = 000000000000
    }
    queues {
      ToggleMasterEvents { }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-config
  namespace: togglemaster
data:
  AUTH_SERVICE_URL: http://auth-service:8001
  FLAG_SERVICE_URL: http://flag-service:8002
  TARGETING_SERVICE_URL: http://targeting-service:8003
  REDIS_URL: redis://redis:6379
  AWS_REGION: us-east-1
  AWS_SQS_ENDPOINT_URL: http://sqs:9324
  AWS_SQS_URL: http://sqs:9324/queue/ToggleMasterEvents
  DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
  AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
