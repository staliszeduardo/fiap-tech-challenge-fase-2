# Exemplo didatico. Execute ./03-gerar-secrets.sh para gerar 03-secrets.yaml.
# Base64 codifica os valores; nao os criptografa.
apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
  namespace: togglemaster
type: Opaque
data:
  POSTGRES_PASSWORD: SUBSTITUA_PELO_BASE64
  MASTER_KEY: SUBSTITUA_PELO_BASE64
  SERVICE_API_KEY: SUBSTITUA_PELO_BASE64
  SERVICE_API_KEY_SHA256: SUBSTITUA_PELO_BASE64
  AWS_ACCESS_KEY_ID: bG9jYWw=
  AWS_SECRET_ACCESS_KEY: bG9jYWw=
